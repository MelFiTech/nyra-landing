<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Nyra Wallet</title>

    <!-- Social share / Open Graph — SITE-WIDE DEFAULT.
         This is a client-rendered SPA, so no-JS crawlers read these static tags
         for every route. Per-page images (og-pricing / og-business / og-about)
         are applied at runtime via usePageMeta for in-app navigation and
         JS-capable unfurlers; delivering them to no-JS crawlers needs
         prerendering. Update the domain below if it is not nyrawallet.com. -->
    <meta
      name="description"
      content="Open a joint account with Nyra, save, spend, and track shared finances with full visibility for you and your partner."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nyra" />
    <meta property="og:title" content="Nyra — Banking for life together" />
    <meta
      property="og:description"
      content="Open a joint account with Nyra, save, spend, and track shared finances with full visibility for you and your partner."
    />
    <meta property="og:url" content="https://nyrawallet.com/" />
    <meta property="og:image" content="https://nyrawallet.com/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nyra — Banking for life together" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Nyra — Banking for life together" />
    <meta
      property="twitter:description"
      content="Open a joint account with Nyra, save, spend, and track shared finances with full visibility for you and your partner."
    />
    <meta property="twitter:image" content="https://nyrawallet.com/og-home.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
